<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 256" role="img" aria-labelledby="title description">
  <title id="title">上行宝 · 行带 · 图文组合</title>
  <desc id="description">原创路径图形。以 SXB 的首字母 S 为骨架，将上下两段学习路径连成一条连续带。斜向负空间与端部切角呼应“行”，不勉强拼入 X、B。 文字为可编辑文本，使用 Noto Sans SC Bold，未转曲。</desc>
