  </g>
  <g id="wordmark" fill="#000000">
    <text x="270" y="170" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="98" font-weight="700" letter-spacing="4">上行宝</text>
  </g>
</svg>
